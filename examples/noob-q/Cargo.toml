[package]
name = "noob-q"
description = "Example: a Pro-Q style parametric EQ whose editor is the OS web view rendering a Vue + Tailwind SPA over bridge"
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://github.com/elyerinfox/vst3-web-stratum"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "noob-q-standalone"
path = "src/bin/standalone.rs"

[features]
default = []
# Build the real VST3 / CLAP plugin (pulls nih-plug from git and embeds
# `web/dist`, so run `npm run build` in `web/` first). Without it the crate is
# just the DSP plus the standalone dev server.
plugin = ["dep:nih_plug", "dep:vst3-web-stratum-nih", "dep:include_dir"]

[dependencies]
vst3-web-stratum.workspace = true
vst3-web-stratum-nih = { workspace = true, optional = true }
nih_plug = { workspace = true, optional = true }
include_dir = { version = "0.7", optional = true }
log.workspace = true
env_logger = "0.11"
rustfft = "6"
serde_json.workspace = true
