# Continuous integration: formatting, lints, tests, API docs, the browser
# package's syntax and exports, and the nih-plug adapter in dev and release.
# The plug-ins built on the framework live in their own repositories and run
# their own CI against these crates from git.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, test, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System packages (wry, nih-plug)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libasound2-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libgl1-mesa-dev libjack-jackd2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Rustdoc
        run: cargo doc --no-deps --workspace --document-private-items

  web:
    name: browser package and adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check the tools and the browser package
        run: |
          for f in tools/*.mjs crates/noob-vst-webgui-framework/web/noob-vst-webgui-framework.js crates/noob-vst-webgui-framework/web/components/*.js crates/noob-vst-webgui-framework/web/vue/*.js; do node --check "$f"; done

      - name: Root package.json exports resolve (what a git install sees)
        run: |
          node --input-type=module -e "
            import { accessSync, readFileSync } from 'node:fs';
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            for (const [key, target] of Object.entries(pkg.exports)) {
              if (key.includes('*')) continue;
              accessSync(target);
              console.log(key, '->', target);
            }
          "

      - name: System packages (wry, nih-plug)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libasound2-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libgl1-mesa-dev libjack-jackd2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: nih-plug adapter (dev, release, devtools)
        run: |
          cargo check -p noob-vst-webgui-framework-nih
          cargo check -p noob-vst-webgui-framework-nih --release
          cargo check -p noob-vst-webgui-framework-nih --features devtools
