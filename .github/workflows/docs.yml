# Publish the Rust API documentation of the FRAMEWORK crates to GitHub Pages
# on every push to main: vst3-web-stratum, vst3-web-stratum-nih, vst3-web-stratum-webview.
#
# The example crates under examples/ (noob-q, noob-wave) are not published
# anywhere: not here, not to crates.io (publish = false), not to npm
# (private). They are built and tested by ci.yml only.
#
# Requires: repository Settings → Pages → Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings --cfg docsrs
    steps:
      - uses: actions/checkout@v4

      - name: System packages (wry needs WebKitGTK, nih-plug needs X11)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libasound2-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libgl1-mesa-dev libjack-jackd2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build rustdoc for the framework crates only
        run: cargo doc --no-deps -p vst3-web-stratum -p vst3-web-stratum-nih -p vst3-web-stratum-webview

      - name: Add a root index
        run: |
          cat > target/doc/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=vst3_web_stratum/index.html">
          <title>vst3-web-stratum API docs</title>
          <p>Redirecting to <a href="vst3_web_stratum/index.html">vst3_web_stratum</a>.
          Framework crates: <a href="vst3_web_stratum/index.html">vst3_web_stratum</a>,
          <a href="vst3_web_stratum_nih/index.html">vst3_web_stratum_nih</a>,
          <a href="vst3_web_stratum_webview/index.html">vst3_web_stratum_webview</a>.</p>
          EOF
          touch target/doc/.nojekyll

      # GitHub Pages is not available on a private repository (free plan): the
      # rustdoc build above still validates on every push; publishing waits
      # until the repository is public. `enablement` turns Pages on by itself.
      - if: ${{ !github.event.repository.private }}
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
