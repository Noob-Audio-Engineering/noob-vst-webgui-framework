[package]
name = "vst3-web-stratum-nih"
description = "nih-plug Editor adapter for bridge: a VST3/CLAP plugin editor that is the OS web view, rendering a page served by the plugin"
readme = "README.md"
documentation = "https://elyerinfox.github.io/vst3-web-stratum/vst3_web_stratum_nih/"
keywords = ["audio", "plugin", "vst3", "clap", "nih-plug"]
categories = ["multimedia::audio", "gui"]
# nih-plug is a git dependency, which crates.io does not accept.
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Developer tools in release builds; see vst3-web-stratum-webview.
devtools = ["vst3-web-stratum-webview/devtools"]

[dependencies]
vst3-web-stratum.workspace = true
vst3-web-stratum-webview.workspace = true
nih_plug.workspace = true
log.workspace = true
