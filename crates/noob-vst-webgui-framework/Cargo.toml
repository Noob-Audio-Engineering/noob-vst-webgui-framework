[package]
name = "noob-vst-webgui-framework"
description = "Low-latency local WebSocket bridge between an audio plugin and a browser-rendered UI"
readme = "README.md"
exclude = ["web/node_modules"]
documentation = "https://noob-audio-engineering.github.io/noob-vst-webgui-framework/noob_vst_webgui_framework/"
keywords = ["audio", "plugin", "vst3", "websocket", "ui"]
categories = ["multimedia::audio", "network-programming", "gui"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["server"]
# The WebSocket/HTTP server. Off, the crate is just the protocol, the parameter
# store and the real-time queues (useful for tests or a custom transport).
server = ["dep:tokio", "dep:axum", "dep:futures-util"]

[dependencies]
crossbeam-queue.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-tungstenite = "0.29"
