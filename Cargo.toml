[workspace]
resolver = "3"
members = [
    "crates/noob-vst-webgui-framework",
    "crates/noob-vst-webgui-framework-webview",
    "crates/noob-vst-webgui-framework-nih",
]
# `cargo build` / `cargo test` at the root only touch these. The nih-plug
# adapter pulls nih-plug from git and is built explicitly (see README).
default-members = [
    "crates/noob-vst-webgui-framework",
]

[workspace.package]
version = "0.1.0"
authors = ["Ely Erin Fox"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Noob-Audio-Engineering/noob-vst-webgui-framework"
homepage = "https://github.com/Noob-Audio-Engineering/noob-vst-webgui-framework"

[workspace.dependencies]
noob-vst-webgui-framework = { path = "crates/noob-vst-webgui-framework" }
noob-vst-webgui-framework-webview = { path = "crates/noob-vst-webgui-framework-webview" }
noob-vst-webgui-framework-nih = { path = "crates/noob-vst-webgui-framework-nih" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util", "fs"] }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[profile.release]
lto = "thin"
codegen-units = 1

[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { git = "https://github.com/Noob-Audio-Engineering/nih-plug.git", branch = "host-resize" }
